plugins {
	id 'fabric-loom' version '1.15.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.isxander.dev/releases" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional GUI Dependencies (modCompileOnly)
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.INCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

remapJar {
	archiveBaseName = project.archives_base_name
}

afterEvaluate {
	def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
	if (targetJarTask != null) {
		def archiveTask = tasks.register('archiveReleaseJar') {
			group = 'build'
			description = 'Automatically copies built release JAR to central Archive Jar of all versions/MC 1.21.1 and Modrinth profile'
			dependsOn targetJarTask
			doLast {
				def jarFile = targetJarTask.archiveFile.get().asFile
				if (!jarFile.exists()) {
					jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
				}
				if (jarFile.exists()) {
					// 1. Central Outer Archive (MC 1.21.1)
					def archiveDir = file("../../Archive Jar of all versions/MC 1.21.1")
					if (!archiveDir.exists()) {
						archiveDir.mkdirs()
					}
					copy {
						from jarFile
						into archiveDir
					}
					println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"
					
					// 2. Modrinth Profile Sync
					def profilePaths = [
						"C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.1/mods"
					]
					profilePaths.each { p ->
						def modrinthProfileMods = file(p)
						if (modrinthProfileMods.exists()) {
							modrinthProfileMods.listFiles().each { f ->
								if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
									f.delete()
									println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
								}
							}
							copy {
								from jarFile
								into modrinthProfileMods
							}
							println "[MODRINTH-SYNC] Deployed ${jarFile.name} to ${p}"
						}
					}
				}
			}
		}
		build.finalizedBy(archiveTask)
	}
}
